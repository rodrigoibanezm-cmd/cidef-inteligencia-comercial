name: Trigger Azure staging deploy

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-azure-staging
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Request staging deployment
        env:
          DEPLOY_TOKEN: ${{ secrets.CIDEF_AZURE_PLATFORM_DISPATCH_TOKEN }}
          FRONT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_TOKEN" ]]; then
            echo "::error::Configure CIDEF_AZURE_PLATFORM_DISPATCH_TOKEN (fine-grained GitHub token with Actions:write on cidef-azure-platform)"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --request POST \
            --url https://api.github.com/repos/rodrigoibanezm-cmd/cidef-azure-platform/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DEPLOY_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"cidef-inteligencia-staging-push\",\"client_payload\":{\"frontend_sha\":\"$FRONT_SHA\"}}"
          echo "Dispatched Azure staging for $FRONT_SHA" >> "$GITHUB_STEP_SUMMARY"
